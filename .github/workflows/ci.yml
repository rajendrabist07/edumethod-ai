name: EduMethod AI CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Dependency Security Audit
        run: npm audit --audit-level=high

      - name: Lint Check
        run: npm run lint

      - name: Type Check
        run: npm run type-check

      - name: Unit Tests & Coverage Verification
        run: npm run test:coverage

      - name: Next.js Build Check
        run: npm run build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Send Failure Webhook Alert
        if: failure()
        run: |
          if [ -n "${{ secrets.DISCORD_WEBHOOK_URL }}" ]; then
            curl -H "Content-Type: application/json" -X POST -d '{
              "content": "❌ **EduMethod AI CI/CD Build Failure**: Validation checks (lint, audit, unit tests, or build) failed on branch `${{ github.ref_name }}`. View run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }' ${{ secrets.DISCORD_WEBHOOK_URL }}
          else
            echo "DISCORD_WEBHOOK_URL is not set, skipping failure alert."
          fi

  e2e-tests:
    needs: validate
    runs-on: ubuntu-latest
    if: ${{ secrets.CLERK_SECRET_KEY != '' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Wait for Vercel Preview Deployment
        id: vercel
        run: |
          echo "Waiting for Vercel deployment status..."
          SHA="${{ github.sha }}"
          REPO="${{ github.repository }}"
          TOKEN="${{ secrets.GITHUB_TOKEN }}"
          URL=""
          
          # Poll GitHub API for deployment status of the current commit
          NO_DEPLOY_COUNT=0
          for i in {1..30}; do
            DEPLOYS=$(curl -s -H "Authorization: token $TOKEN" "https://api.github.com/repos/$REPO/deployments?sha=$SHA")
            DEPLOY_ID=$(echo "$DEPLOYS" | grep -m 1 -o '"id": [0-9]*' | grep -o '[0-9]*')
            
            if [ -n "$DEPLOY_ID" ]; then
              STATUSES=$(curl -s -H "Authorization: token $TOKEN" "https://api.github.com/repos/$REPO/deployments/$DEPLOY_ID/statuses")
              STATE=$(echo "$STATUSES" | grep -m 1 -o '"state": "[^"]*"' | cut -d'"' -f4)
              
              if [ "$STATE" = "success" ]; then
                URL=$(echo "$STATUSES" | grep -m 1 -o '"environment_url": "[^"]*"' | cut -d'"' -f4)
                if [ -z "$URL" ]; then
                  URL=$(echo "$STATUSES" | grep -m 1 -o '"target_url": "[^"]*"' | cut -d'"' -f4)
                fi
                if [ -n "$URL" ]; then
                  echo "Vercel preview URL is ready: $URL"
                  echo "url=$URL" >> $GITHUB_OUTPUT
                  exit 0
                fi
              fi
            else
              NO_DEPLOY_COUNT=$((NO_DEPLOY_COUNT+1))
              if [ "$NO_DEPLOY_COUNT" -ge 3 ]; then
                echo "No deployments found after 3 checks. Assuming Vercel integration is not active."
                break
              fi
            fi
            echo "Deployment not ready yet, sleeping 10 seconds (attempt $i/30)..."
            sleep 10
          done
          echo "Vercel deployment timeout, falling back to local server."
          echo "url=http://localhost:3000" >> $GITHUB_OUTPUT

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E Tests
        run: |
          if [ "${{ steps.vercel.outputs.url }}" = "http://localhost:3000" ] || [ -z "${{ steps.vercel.outputs.url }}" ]; then
            echo "Starting local dev server and running E2E tests..."
            npx start-server-and-test 'npm run dev' http://localhost:3000 'npx playwright test'
          else
            echo "Running E2E tests against Vercel preview URL: ${{ steps.vercel.outputs.url }}"
            npx playwright test
          fi
        env:
          PLAYWRIGHT_TEST_BASE_URL: ${{ steps.vercel.outputs.url || 'http://localhost:3000' }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ENABLE_E2E_MOCK: "true"

      - name: Send Failure Webhook Alert
        if: failure()
        run: |
          if [ -n "${{ secrets.DISCORD_WEBHOOK_URL }}" ]; then
            curl -H "Content-Type: application/json" -X POST -d '{
              "content": "❌ **EduMethod AI CI/CD E2E Failure**: Playwright End-to-End tests failed on branch `${{ github.ref_name }}`. View run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }' ${{ secrets.DISCORD_WEBHOOK_URL }}
          else
            echo "DISCORD_WEBHOOK_URL is not set, skipping failure alert."
          fi
