<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Glowing background gradient -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    
    <!-- Luminous inner glow shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#7c3aed" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Luminous circle background -->
  <circle cx="128" cy="128" r="112" fill="url(#bg-gradient)" filter="url(#glow)" />
  <circle cx="128" cy="128" r="111" stroke="white" stroke-opacity="0.2" stroke-width="2" />

  <!-- White high-contrast silhouette -->
  <g transform="translate(48, 48)">
    <!-- Open Book base (representing knowledge & syllabus) -->
    <path d="M80 125C50 125 25 132 15 136V45C25 41 50 36 80 40" stroke="white" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M80 125C110 125 135 132 145 136V45C135 41 110 36 80 40" stroke="white" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M80 40V125" stroke="white" stroke-width="10" stroke-linecap="round" />

    <!-- Stylized Graduation Cap (representing structured learning methods) -->
    <path d="M80 14L135 36L80 58L25 36L80 14Z" fill="white" />
    <path d="M47 44V56C47 64 62 70 80 70C98 70 113 64 113 56V44" fill="white" opacity="0.95" />
    
    <!-- Tassel -->
    <path d="M80 36L125 54V76" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <circle cx="125" cy="79" r="5" fill="white" />

    <!-- AI Luminous Spark (representing hyper-accuracy & cognitive pipeline) -->
    <path d="M80 -18L83 -4L97 -1L83 2L80 16L77 2L63 -1L77 -4L80 -18Z" fill="#22d3ee" />
  </g>
</svg>
